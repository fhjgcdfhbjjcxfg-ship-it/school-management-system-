<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المدارس</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}
header{background:#173b65;color:white;padding:20px;text-align:center}
.container{max-width:1000px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #ddd}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:7px;border:1px solid #ddd;font-size:16px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
button:hover{background:#104c80}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.stat{background:#1769aa;color:white;padding:20px;border-radius:10px;text-align:center}
.stat h2{font-size:30px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
nav button{width:auto;flex:1}
table{width:100%;border-collapse:collapse}
td,th{padding:12px;border-bottom:1px solid #ddd;text-align:center}
</style>
</head>
