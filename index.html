<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المدارس</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            text-align: center;
            margin: 0;
            padding: 30px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            margin: 50px auto;
            box-shadow: 0 2px 10px #ccc;
        }
        h1 {
            color: #2563eb;
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام إدارة المدارس</h1>
    <h3>تسجيل الدخول</h3>

    <input type="text" placeholder="اسم المستخدم">
    <input type="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>
</div>

<script>
function login() {
    alert("مرحباً بك في نظام إدارة المدارس");
}
</script>

</body>
      </html>
